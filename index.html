<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>Infinite Sudoku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Gochi+Hand&display=swap">
<style>
  /* Layout: a full-bleed canvas of endless ruled lines with a numbered gutter; a floating glass rail on top, a glass dock below, a ruled-paper verdict card. */
  :root {
    --void: #090d18;        /* the page at night */
    --void-2: #0f1526;      /* raised glass */
    --ink: #e9edf8;         /* primary text */
    --dim: #5b6690;         /* other people's numbers, captions */
    --faint: #39446a;       /* hairlines on glass */
    --line: #222b47;        /* ruled lines */
    --pen: #ff4f64;         /* teacher's red pen */
    --pencil: #8fb4ff;      /* the player's digits */
    --paper: #fbfaf6;       /* the verdict card */
    --paper-ink: #1a1e2c;
    --paper-rule: #dfe6f3;
    --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --font-hand: "Gochi Hand", "Comic Sans MS", "Chalkboard SE", cursive;
    --glass: color-mix(in srgb, var(--void-2) 72%, transparent);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--void); color: var(--ink); font-family: var(--font-mono); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: text; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% 45%, transparent 55%, color-mix(in srgb, var(--void) 85%, transparent) 100%),
      linear-gradient(var(--void), transparent 110px, transparent calc(100% - 130px), var(--void));
  }
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid color-mix(in srgb, var(--faint) 70%, transparent);
    box-shadow: 0 10px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
  }

  /* Top rail */
  .rail {
    position: fixed; left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 14px);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 8px 8px 8px 12px; border-radius: 14px;
  }
  .rail, .rail .brand { transition: opacity .75s; }
  body.preload .rail, body.preload-brand .rail .brand { opacity: 0; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mark {
    flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    background: var(--pen); color: #fff; font: 700 17px var(--font-display); box-shadow: 0 4px 16px color-mix(in srgb, var(--pen) 45%, transparent);
  }
  h1 { margin: 0; font: 700 clamp(13px, 2vw, 16px) var(--font-display); letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  h1 small { display: block; font: 400 10px var(--font-mono); color: var(--dim); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 2px; }
  .stats { display: flex; align-items: center; gap: 6px; }
  .stat { padding: 4px 12px; border-left: 1px solid var(--faint); line-height: 1.15; }
  .stat span { display: block; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
  .stat b { display: inline-block; font: 600 16px var(--font-mono); font-variant-numeric: tabular-nums; transition: color .3s; }
  .stat b.bad { color: var(--pen); }
  .stat b.bump { animation: bump .5s ease; }
  @keyframes bump { 30% { transform: scale(1.25); } }
  .stat select {
    display: block; font: 600 14px var(--font-mono); color: var(--ink); background: transparent; border: 0; padding: 0 14px 0 0; margin: 0;
    cursor: pointer; appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(-45deg, transparent 50%, var(--dim) 50%);
    background-position: right 5px top 9px, right 1px top 9px; background-size: 4px 4px; background-repeat: no-repeat;
  }
  .stat select option { background: var(--void-2); color: var(--ink); }
  .stat select:focus-visible { outline: 2px solid var(--pencil); outline-offset: 2px; border-radius: 3px; }
  .stat select:disabled { opacity: .5; cursor: default; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; cursor: pointer;
    background: transparent; border: 1px solid var(--faint); color: var(--ink); margin-left: 6px;
  }
  .icon-btn:hover { background: color-mix(in srgb, var(--faint) 35%, transparent); }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn .off, .icon-btn[aria-pressed="true"] .on { display: none; }
  .icon-btn[aria-pressed="true"] .off { display: block; }
  .icon-btn[aria-pressed="true"] { color: var(--dim); }

  /* Bottom dock */
  .dock {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    width: min(560px, calc(100% - 32px)); display: flex; align-items: center; gap: 12px;
    padding: 8px 8px 8px 16px; border-radius: 16px; transition: opacity .35s, transform .35s;
  }
  .dock.away { opacity: 0; transform: translate(-50%, 20px); pointer-events: none; }
  .keys { flex: 1; min-width: 0; display: flex; gap: 14px; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; }
  .keys .count { color: var(--pencil); font-variant-numeric: tabular-nums; }
  kbd {
    font: 500 10px var(--font-mono); color: var(--ink); padding: 2px 6px; border-radius: 5px; margin-right: 4px;
    border: 1px solid var(--faint); border-bottom-width: 2px; background: color-mix(in srgb, var(--void) 60%, transparent);
  }
  .check {
    flex: none; display: flex; align-items: center; gap: 10px; cursor: pointer;
    font: 600 13px var(--font-mono); color: #fff; background: var(--pen); border: 0; border-radius: 11px; padding: 11px 16px;
    box-shadow: 0 6px 22px color-mix(in srgb, var(--pen) 40%, transparent); transition: transform .15s, filter .15s;
  }
  .check:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .check:active { transform: translateY(1px); }
  .check kbd { color: #fff; border-color: rgba(255,255,255,.4); background: rgba(0,0,0,.12); margin: 0; }
  .touch-only { display: none; }
  @media (pointer: coarse) { .touch-only { display: inline; } .fine-only { display: none; } }
  @media (max-width: 560px) { #score-stat { display: none; } h1 small { display: none; } }

  /* Flight readout */
  .hud {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 82px); transform: translateX(-50%);
    width: min(420px, calc(100% - 32px)); padding: 12px 16px 14px; border-radius: 14px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .hud .dir { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--pen); }
  .hud .coords { font: 500 13px var(--font-mono); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud .coords em { font-style: normal; color: var(--dim); margin: 0 4px; }
  .hud .track { height: 3px; border-radius: 3px; background: var(--line); margin-top: 10px; overflow: hidden; }
  .hud .track i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--pencil), var(--pen)); border-radius: inherit; }

  /* Verdict card: a sheet of ruled school paper */
  .card {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    width: min(560px, calc(100% - 32px)); max-height: calc(100% - 140px); overflow: auto;
    color: var(--paper-ink); border-radius: 10px; padding: 20px 22px 18px 52px;
    background:
      linear-gradient(90deg, transparent 36px, color-mix(in srgb, var(--pen) 55%, transparent) 36px 37.5px, transparent 37.5px),
      repeating-linear-gradient(var(--paper) 0 25px, var(--paper-rule) 25px 26px),
      var(--paper);
    background-position: 0 0, 0 12px, 0 0;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    animation: slap 420ms cubic-bezier(.2,1.6,.4,1) both;
  }
  @keyframes slap { from { transform: translate(-50%, 40px) rotate(-4deg) scale(.9); opacity: 0; } }
  .card .stamp { font-family: var(--font-hand); color: var(--pen); font-size: 36px; line-height: 1; transform: rotate(-2deg); display: inline-block; }
  .card p { margin: 10px 0 0; font-size: 14px; line-height: 26px; max-width: 62ch; }
  .card .big {
    font: 12px/1.6 var(--font-mono); word-break: break-all; white-space: pre-wrap; color: #959aae;
    background: color-mix(in srgb, var(--paper-rule) 45%, var(--paper)); border: 1px dashed var(--paper-rule);
    border-radius: 6px; padding: 8px 10px; margin-top: 12px; max-height: 7.5em; overflow: auto;
  }
  .card .big mark { background: color-mix(in srgb, var(--pen) 12%, transparent); color: var(--pen); font-weight: 600; border-radius: 3px; padding: 0 1px; }
  .card .penalty {
    float: right; margin: -4px 0 8px 14px; width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center;
    font: 400 26px var(--font-hand); color: var(--pen); border: 2.5px solid var(--pen); transform: rotate(8deg);
  }
  .card .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .card button {
    font: 600 13px var(--font-mono); padding: 10px 16px; border-radius: 9px; cursor: pointer;
    border: 1.5px solid var(--paper-ink); background: var(--paper-ink); color: var(--paper); transition: transform .15s;
  }
  .card button:hover { transform: translateY(-1px); }
  .card button.ghost { background: transparent; color: var(--paper-ink); }

  /* Start gate: browsers only allow sound after a click, so the intro waits for one */
  .gate {
    position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 16px;
    background: transparent; border: 0; color: var(--ink); font: inherit; cursor: pointer; transition: opacity .5s;
  }
  .gate b { font: 400 clamp(36px, 7vw, 56px)/1 var(--font-hand); color: var(--pen); text-shadow: 0 6px 40px rgba(0,0,0,.9); animation: breathe 2s ease-in-out infinite; }
  .gate small { font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim); }
  .gate.out { opacity: 0; pointer-events: none; }
  .gate:focus-visible { outline: none; }
  @keyframes breathe { 50% { opacity: .55; transform: scale(.97); } }
  body.gated .title-intro { display: none; }

  /* Opening title: shows over the swoop down to your notebook, then lifts away */
  .title-intro {
    position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px;
    pointer-events: none; text-align: center; padding: 16px;
  }
  .title-intro h2 {
    position: relative; margin: 0; font: 700 clamp(30px, 7vw, 64px)/1.05 var(--font-display); letter-spacing: -0.02em;
    text-shadow: 0 8px 50px rgba(0,0,0,.9);
  }
  .title-intro h2 .ch { display: inline-block; white-space: pre; }
  .title-intro .pen { position: fixed; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .title-intro .pen path {
    fill: none; stroke: var(--pen); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1;
    filter: drop-shadow(0 0 10px color-mix(in srgb, var(--pen) 55%, transparent));
  }
  .title-intro p { margin: 0; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim); }

  /* Opening sheet: pick a difficulty before the page lets you write */
  .scrim { position: fixed; inset: 0; background: color-mix(in srgb, var(--void) 70%, transparent); animation: fade .4s both; transition: opacity .3s; }
  .scrim.out { opacity: 0; }
  @keyframes fade { from { opacity: 0; } }
  .card.intro { top: 50%; bottom: auto; transform: translate(-50%, -50%); max-height: calc(100% - 32px); animation-name: drop; }
  @keyframes drop { from { transform: translate(-50%, -46%) rotate(-3deg) scale(.92); opacity: 0; } }
  .card.intro .levels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .card.intro.out { animation: toss .32s cubic-bezier(.5,0,.8,.4) both; }
  @keyframes toss { to { transform: translate(-50%, -20%) rotate(5deg) scale(.94); opacity: 0; } }
  .card.intro .levels button { animation: pop-in .45s calc(.2s + var(--i) * 70ms) cubic-bezier(.2,1.5,.4,1) backwards; }
  @keyframes pop-in { from { opacity: 0; transform: translateY(12px) scale(.95); } }
  .card.intro .levels button { text-align: left; padding: 10px 14px 12px; background: transparent; color: var(--paper-ink); }
  .card.intro .levels button:hover { background: var(--paper-ink); color: var(--paper); }
  .card.intro .levels b { display: block; font: 700 14px var(--font-display); }
  .card.intro .levels small { display: block; font: 400 11px/1.4 var(--font-mono); margin-top: 4px; opacity: .75; }
  @media (max-width: 420px) { .card.intro .levels { grid-template-columns: 1fr; } }

  .toast {
    position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) rotate(-3deg);
    font-family: var(--font-hand); font-size: clamp(36px, 7vw, 64px); color: var(--pen);
    pointer-events: none; text-shadow: 0 6px 40px rgba(0,0,0,.9); animation: pop .3s cubic-bezier(.2,1.6,.4,1) both;
  }
  @keyframes pop { from { transform: translate(-50%, -50%) rotate(-3deg) scale(.6); opacity: 0; } }
  button:focus-visible { outline: 2px solid var(--pencil); outline-offset: 2px; }
  .card button:focus-visible { outline-color: var(--pen); }
  .sr { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
  @media (prefers-reduced-motion: reduce) { .card, .toast, .stat b.bump, .rail { animation: none; } .title-intro { display: none; } .scrim, .gate b { animation: none; } }
</style>
</head>
<body class="preload preload-brand gated">

<canvas id="cv" aria-label="Endless ruled number lines"></canvas>
<div class="vignette"></div>

<header class="rail glass">
  <div class="brand">
    <div class="mark" aria-hidden="true">∞</div>
    <h1>Infinite Sudoku<small>Every number. Somewhere.</small></h1>
  </div>
  <div class="stats">
    <label class="stat"><span>Difficulty</span><select id="level">
      <option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option><option value="expert">Expert</option>
    </select></label>
    <div class="stat" id="score-stat"><span>Score</span><b id="score">0</b></div>
    <div class="stat"><span>Mistakes</span><b id="mistakes">0</b></div>
    <button class="icon-btn" id="mute" type="button" aria-pressed="false" aria-label="Mute sound">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>
    </button>
  </div>
</header>

<div class="dock glass" id="dock">
  <div class="keys">
    <span class="fine-only"><kbd>click</kbd>pick a spot</span>
    <span class="fine-only"><kbd>0–9</kbd>write</span>
    <span class="fine-only"><kbd>⌫</kbd>erase</span>
    <span class="touch-only">Tap anywhere to write · drag to move</span>
    <span class="count" id="count">0 digits</span>
  </div>
  <button class="check" id="check" type="button">Submit <kbd class="fine-only">⏎</kbd></button>
</div>

<input class="sr" id="kb" type="text" inputmode="numeric" autocomplete="off" aria-label="Your number">
<div class="hud glass" id="hud" hidden><div class="dir" id="hud-dir"></div><div class="coords" id="hud-coords"></div><div class="track"><i id="hud-bar"></i></div></div>
<div class="toast" id="toast" hidden></div>
<section class="card" id="card" role="dialog" aria-live="assertive" hidden></section>
<button class="gate" id="gate" type="button">
  <b><span class="fine-only">click to begin</span><span class="touch-only">tap to begin</span></b>
  <small>Sound on</small>
</button>
<div class="title-intro" id="title-intro" aria-hidden="true">
  <svg class="pen"><path pathLength="1"/></svg>
  <h2 data-text="Infinite Sudoku"></h2>
  <p>Every number. Somewhere.</p>
</div>
<div class="scrim" id="scrim" hidden></div>
<section class="card intro" id="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title" hidden>
  <span class="stamp" id="intro-title">Pick a difficulty.</span>
  <p>The rest of the page is already covered in everyone else's numbers. How crowded should it be?</p>
  <div class="levels" id="levels"></div>
</section>

<script>
(() => {
  const QUIPS = [
    "Lines are a social construct.",
    "On an infinite page, every number has been written before. Usually by someone more careful.",
    "The rules say no repeats. They never said where.",
    "I checked with the Sudoku Council. They're on my side.",
    "That's exactly what someone who made a silly mistake would say.",
    "Originality was never an option here, sweetie."
  ];
  const OPENERS = ["Umm, actually?", "Ahem.", "Oh no. Oh no no no.", "Bless your heart.", "Sweetie…", "Copycat."];

  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const $ = id => document.getElementById(id);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // World units: one digit column = 1 wide, one ruled row = ROW tall. Row r sits between y = r*ROW and (r+1)*ROW.
  const ROW = 2, BLANK = 40; // rows |r| <= BLANK are your clean notebook; everything else is already full.
  let state = { entries: [], current: "", caret: { x: 0, r: 0 }, score: 0, mistakes: 0, muted: false, wonOnce: false, found: [], level: "medium" };
  let busy = false, target = null, flight = null;
  let W = 0, H = 0, dpr = 1, cam = { x: 0, y: 0, s: 22 }, view = null;

  // ---------- hashing ----------
  const TWO32 = 4294967296;
  function mix(a) { a ^= a >>> 16; a = Math.imul(a, 0x7feb352d); a ^= a >>> 15; a = Math.imul(a, 0x846ca68b); a ^= a >>> 16; return a >>> 0; }
  function hash(x, y, k) {
    const xh = Math.floor(x / TWO32) | 0, yh = Math.floor(y / TWO32) | 0;
    return mix((x | 0) ^ mix(xh ^ mix((y | 0) ^ mix(yh ^ mix(k + 0x51ed27)))));
  }
  const NB_W = 5000; // your clean notebook: rows |r| <= BLANK, columns |x| < NB_W
  const inNotebook = (x, r) => Math.abs(r) <= BLANK && Math.abs(x) < NB_W;
  // Difficulty sets how crowded everyone else's page is: the share of lines with numbers on them,
  // and the share of number slots on those lines left empty.
  const LEVELS = {
    easy:   { name: "Easy",   blurb: "A few lines written on. Lots of room.", rows: 20,  gaps: 60, note: "fewer numbers. same odds." },
    medium: { name: "Medium", blurb: "Some lines full, some empty.",          rows: 40,  gaps: 33, note: "a normal amount of everyone." },
    hard:   { name: "Hard",   blurb: "Most lines packed with numbers.",       rows: 70,  gaps: 15, note: "getting crowded out there." },
    expert: { name: "Expert", blurb: "Every line. Every column. Full.",       rows: 100, gaps: 0,  note: "every line. every column." }
  };
  const level = () => LEVELS[state.level] || LEVELS.medium;
  const rowFilled = r => hash(0, r, 3) % 100 < level().rows;
  function numSeed(num, k) {
    let h = mix(k * 7919 + num.length);
    for (let i = 0; i < num.length; i++) h = mix(h ^ (num.charCodeAt(i) + i * 131));
    return h;
  }
  // Matches you've been shown stay written where they were found, so a later trip past them still sees them.
  let foundByRow = new Map();
  function remember(t) {
    if (!state.found.some(f => f.x === t.x && f.r === t.r && f.num === t.num)) state.found.push({ x: t.x, r: t.r, num: t.num });
    indexFound();
  }
  function indexFound() {
    foundByRow = new Map();
    for (const f of state.found) { if (!foundByRow.has(f.r)) foundByRow.set(f.r, []); foundByRow.get(f.r).push(f); }
  }
  function digitAt(x, r) {
    const fr = foundByRow.get(r);
    if (fr) for (const f of fr) {
      if (x >= f.x && x < f.x + f.num.length) return f.num[x - f.x];
      if (x >= f.x - SLOT && x < slotEnd(f.x + f.num.length) + SLOT) return " ";
    }
    if (target && target.axis !== "self" && r === target.r && x >= target.x && x < target.x + target.num.length) return target.num[x - target.x];
    if (inNotebook(x, r) || !rowFilled(r)) return " ";
    // Filled lines hold separate numbers with gaps: one per 32-column stretch, sometimes none.
    if (target && r === target.r && x >= target.x - SLOT && x < slotEnd(target.x + target.num.length) + SLOT) return " ";
    const len = slotLen(Math.floor(x / SLOT), r), off = x - Math.floor(x / SLOT) * SLOT;
    if (off >= len) return " ";
    return String(off === 0 ? 1 + hash(x, r, 1) % 9 : hash(x, r, 1) % 10);
  }
  // Numbers sit in fixed 32-column slots, left-aligned like your own, with room to spare so none touch.
  const SLOT = 32, slotEnd = x => Math.ceil(x / SLOT) * SLOT;
  function slotLen(slot, r) { const h = hash(slot, r, 2); return h % 100 < level().gaps ? 0 : 2 + (h >>> 8) % 20; }

  // ---------- camera ----------
  const homeS = () => Math.min(26, Math.max(16, W / 34));
  function homeCam() { return { x: view.x, y: view.y, s: homeS() }; }
  function clampView() {
    view.x = Math.min(NB_W, Math.max(-NB_W, view.x));
    view.y = Math.min(BLANK * ROW, Math.max(-BLANK * ROW, view.y));
  }
  // Nudge the view just enough to keep the caret (and what you're typing) on screen.
  function keepCaretInView() {
    const s = homeS(), hw = W / 2 / s, hh = H / 2 / s, c = state.caret;
    const x0 = c.x, x1 = c.x + state.current.length + 1, cy = c.r * ROW + ROW / 2;

        <span class="penalty">−50</span>
        <span class="stamp">Arguing with the page.</span>
        <p>${QUIPS[Math.floor(Math.random() * QUIPS.length)]} Another 50 points off for attitude.</p>
        <div class="actions"><button type="button" id="sorry">Fine. Sorry</button></div>`;
      honk();
      $("sorry").focus(); $("sorry").onclick = goHome;
    };
  }

  function commit(ok) {
    const c = state.caret;
    state.entries.push({ x: c.x, r: c.r, num: state.current, ok });
    state.current = ""; syncCount();
    if (c.r < BLANK && !entryAt(c.x, c.r + 1)) state.caret = { x: c.x, r: c.r + 1 };
    keepCaretInView();
  }
  function goHome() {
    duck(0.45);
    $("card").hidden = true;
    commit(false);
    fly(homeCam(), target && target.axis === "self" ? 2600 : 9000, () => { target = null; busy = false; setPad(); });
  }

  // Typing: physical keys anywhere, or the phone keyboard through a hidden field the page focuses on tap.
  const kb = $("kb");
  $("check").onclick = submit;
  let drag = null;
  cv.addEventListener("pointerdown", e => {
    if (busy) return;
    drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false };
    try { cv.setPointerCapture(e.pointerId); } catch {}
  });
  cv.addEventListener("pointermove", e => {
    if (!drag || busy) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.hypot(dx, dy) > 6) drag.moved = true;
    if (drag.moved) { view.x = drag.vx - dx / homeS(); view.y = drag.vy - dy / homeS(); clampView(); }
  });
  cv.addEventListener("pointerup", e => {
    const d = drag; drag = null;
    if (!d || d.moved || busy) return;
    const x = Math.floor((e.clientX - W / 2) / cam.s + cam.x), r = Math.floor(((e.clientY - H / 2) / cam.s + cam.y) / ROW);
    if (!inNotebook(x, r)) toast("that part's taken.", 800);
    else if (entryAt(x, r)) toast("already graded.", 800);
    else { state.caret = { x, r }; keepCaretInView(); }
    if (e.pointerType === "touch") tapped = true; else kb.focus({ preventScroll: true });
  });
  // Phones only raise the keyboard when focus happens inside a touch event, so a plain tap focuses again on touchend.
  let tapped = false;
  cv.addEventListener("touchend", () => { if (tapped) kb.focus({ preventScroll: true }); tapped = false; });
  cv.addEventListener("pointercancel", () => { drag = null; });
  cv.addEventListener("wheel", e => {
    if (busy) return;
    e.preventDefault();
    const s = homeS();
    view.x += (e.shiftKey ? e.deltaY : e.deltaX) / s; view.y += (e.shiftKey ? 0 : e.deltaY) / s; clampView();
  }, { passive: false });
  function moveCaret(dx, dr) {
    const c = state.caret, n = { x: c.x + dx, r: c.r + dr };
    if (inNotebook(n.x, n.r)) { state.caret = n; keepCaretInView(); }
  }
  const ARROWS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
  kb.addEventListener("input", () => {
    if (busy) { kb.value = state.current; return; }
    const v = kb.value.replace(/\D/g, "");
    if (v.length > state.current.length) { audio(); tick(); }
    state.current = v; syncCount(); keepCaretInView();
  });
  $("level").onchange = e => {
    if (busy || !LEVELS[e.target.value]) { e.target.value = state.level; return; }
    state.level = e.target.value; toast(level().note, 1600); e.target.blur();
  };
  // Opening sheet: the page stays locked until a difficulty is chosen.
  function openIntro() {
    busy = true; setPad();
    $("levels").innerHTML = Object.entries(LEVELS).map(([k, l]) =>
      `<button type="button" data-level="${k}" style="--i:${Object.keys(LEVELS).indexOf(k)}"><b>${l.name}</b><small>${l.blurb}</small></button>`).join("");
    $("levels").onclick = e => { const b = e.target.closest("button"); if (b) pickLevel(b.dataset.level); };
    $("scrim").hidden = false; $("intro").hidden = false;
    $("levels").querySelector(`[data-level="${state.level}"]`).focus();
  }
  function pickLevel(k) {
    if ($("intro").classList.contains("out")) return;
    state.level = k; state.picked = true; renderStats(); audio();
    kb.focus({ preventScroll: true }); // inside the tap itself, so phones raise the keyboard
    $("intro").classList.add("out"); $("scrim").classList.add("out");
    setTimeout(() => {
      for (const id of ["intro", "scrim"]) { $(id).hidden = true; $(id).classList.remove("out"); }
      busy = false; setPad();
      toast(level().note, 1400);
    }, reduced ? 0 : 320);
  }

  // Opening title: letters drop in one by one, then the red pen writes one continuous stroke: under the title,
  // round the right end and back over the top, and into an ∞ above it. The tail follows the pen into the ∞, leaving only
  // the ∞, which flies into the top bar with the title to become the logo.
  const penD = pts => "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L");
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let titleDone = Promise.resolve(), inf = null;
  function penStroke(h2) {
    const r = h2.getBoundingClientRect(), fs = parseFloat(getComputedStyle(h2).fontSize);
    const x0 = r.left - r.width * 0.03, x1 = r.right + r.width * 0.03, y0 = r.bottom + fs * 0.1;
    const A = Math.min(64, fs * 1.15), cx = (r.left + r.right) / 2, cy = r.top - A * 0.75;
    const pts = [];
    // Underline, with a slight hand wobble.
    for (let i = 0; i <= 60; i++) { const u = i / 60; pts.push([x0 + (x1 - x0) * u, y0 + Math.sin(u * Math.PI * 3) * fs * 0.05]); }
    // ∞ (lemniscate) entry: the top of its right loop, where the curve is heading left.
    const lem = t => { const d = 1 + Math.sin(t) ** 2; return [cx + A * Math.cos(t) / d, cy + A * Math.sin(t) * Math.cos(t) / d]; };
    let tTop = 0; for (let t = 0; t > -Math.PI / 2; t -= 0.002) if (lem(t)[1] < lem(tTop)[1]) tTop = t;
    const [ex, ey] = lem(tTop);
    // Hook: a rounded swing out past the title's right end and back up, then left above the title into the ∞.
    const cubic = (P, n) => { for (let i = 1; i <= n; i++) { const u = i / n, v = 1 - u; pts.push([0, 1].map(k => v * v * v * P[0][k] + 3 * v * v * u * P[1][k] + 3 * v * u * u * P[2][k] + u * u * u * P[3][k])); } };
    const k = Math.max(16, Math.min(0.67 * (y0 - ey), (innerWidth - 12 - x1) / 0.75));
    cubic([[x1, y0], [x1 + k, y0], [x1 + k, ey], [x1, ey]], 40);
    cubic([[x1, ey], [x1 - (x1 - ex) * 0.4, ey - fs * 0.08], [ex + (x1 - ex) * 0.3, ey], [ex, ey]], 30);
    const infFrom = pts.length - 1;
    // Then once round the ∞, back to where it came in.
    for (let i = 1; i <= 180; i++) pts.push(lem(tTop - i / 180 * Math.PI * 2));
    let len = 0, infAt = 0;
    for (let i = 1; i < pts.length; i++) { len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); if (i === infFrom) infAt = len; }
    return { d: penD(pts), f: infAt / len, cx, cy, A };
  }
  function playTitle() {
    const el = $("title-intro"), h2 = el.querySelector("h2"), p = el.querySelector("p"), path = el.querySelector("path"), E = "cubic-bezier(.2,1,.3,1)";
    if (reduced) { el.remove(); document.body.classList.remove("preload", "preload-brand"); return; }
    h2.innerHTML = [...h2.dataset.text].map(c => `<span class="ch">${c}</span>`).join("");
    h2.querySelectorAll(".ch").forEach((c, i) => c.animate([
      { opacity: 0, transform: "translateY(0.6em) rotate(10deg)", filter: "blur(6px)" },
      { opacity: 1, transform: "none", filter: "none" }
    ], { duration: 780, delay: 300 + i * 52, easing: E, fill: "backwards" }));
    p.animate([{ opacity: 0, letterSpacing: "0.8em" }, { opacity: 1, letterSpacing: "0.3em" }], { duration: 900, delay: 1500, easing: E, fill: "backwards" });
    titleDone = (async () => {
      await wait(1200);
      const st = penStroke(h2);
      inf = st;
      path.setAttribute("d", st.d);
      // One dash slides along the path: the head is where the pen is, the tail starts chasing once the pen reaches the ∞.
      const ms = 1850, t0 = performance.now();
      await new Promise(done => {
        const step = now => {
          const k = Math.min(1, (now - t0) / ms);
          const head = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
          let tail = head <= st.f ? 0 : (head - st.f) / (1 - st.f);
          tail = st.f * (1 - Math.pow(1 - tail, 2));
          path.style.strokeDasharray = `${Math.max(0.0001, head - tail)} 2`;
          path.style.strokeDashoffset = -tail;
          path.style.strokeWidth = head > st.f ? 4 + 1.5 * (head - st.f) / (1 - st.f) : 4;
          if (k < 1) requestAnimationFrame(step); else done();
        };
        requestAnimationFrame(step);
      });
    })();
  }
  function landTitle() {
    const el = $("title-intro"), body = document.body;
    body.classList.remove("preload");
    if (!el || !el.isConnected) { body.classList.remove("preload-brand"); return; }
    const brand = document.querySelector(".rail .brand"), h1 = brand.querySelector("h1"), range = document.createRange();
    range.selectNodeContents(h1.firstChild);
    const EASE = "cubic-bezier(.6,0,.2,1)", DUR = 950;
    const h2 = el.querySelector("h2"), a = h2.getBoundingClientRect(), to = range.getBoundingClientRect();
    h2.animate([{ transform: "none" }, {
      transform: `translate(${to.left + to.width / 2 - (a.left + a.width / 2)}px, ${to.top + to.height / 2 - (a.top + a.height / 2)}px) scale(${to.width / a.width})`
    }], { duration: DUR, easing: EASE, fill: "forwards" });
    el.querySelector("p").animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, fill: "forwards" });
    // The pen's ∞ shrinks into the red logo tile, then hands over to it.
    const pen = el.querySelector(".pen"), m = brand.querySelector(".mark").getBoundingClientRect();
    pen.style.transformOrigin = `${inf.cx}px ${inf.cy}px`;
    pen.animate([{ transform: "none" }, {
      transform: `translate(${m.left + m.width / 2 - inf.cx}px, ${m.top + m.height / 2 - inf.cy}px) scale(${m.width * 0.34 / inf.A})`
    }], { duration: DUR, easing: EASE, fill: "forwards" })
      .finished.then(() => {
        body.classList.remove("preload-brand");
        el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, fill: "forwards" }).finished.then(() => el.remove());
      });
  }
  $("mute").onclick = () => { state.muted = !state.muted; renderStats(); music(); };
  addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest(".card, select")) return;
    if (!busy && ARROWS[e.key]) { moveCaret(...ARROWS[e.key]); e.preventDefault(); return; }
    if (e.target === kb) { if (e.key === "Enter") { submit(); e.preventDefault(); } return; }
    if (/^[0-9]$/.test(e.key)) { type(e.key); e.preventDefault(); }
    else if (e.key === "Backspace" || e.key === "Delete") { erase(); e.preventDefault(); }
    else if (e.key === "Enter") { submit(); e.preventDefault(); }
  });
  addEventListener("paste", e => {
    if (e.target === kb) return; type((e.clipboardData || window.clipboardData).getData("text") || ""); e.preventDefault(); });
  addEventListener("resize", resize);

  // Background music: tries to start on load; most browsers block sound until the first key or tap, so it retries then.
  // Follows the sound toggle, ducks under the buzzer.
  const bgm = new Audio("infinite-pain.mp3");
  bgm.loop = true; bgm.volume = 0.45;
  function music() {
    if (state.muted) bgm.pause();
    else bgm.play().catch(() => {});
  }
  function duck(v) {
    const from = bgm.volume, t0 = performance.now();
    const step = now => { const t = Math.min(1, (now - t0) / 600); bgm.volume = from + (v - from) * t; if (t < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  addEventListener("pointerdown", music, { once: true });
  addEventListener("keydown", music, { once: true });

  function start(saved) {
    if (saved && Array.isArray(saved.entries)) {
      state = { ...state, ...saved };
      state.entries = state.entries.map((e, i) => typeof e === "string" ? { x: 0, r: i, num: e, ok: false } : e);
      if (!saved.caret) state.caret = { x: 0, r: state.entries.length };
      if (!Array.isArray(state.found)) state.found = [];
      if (!LEVELS[state.level]) state.level = "medium";
      indexFound();
    }
    readColors(); measureMono(); resize(); renderStats(); setPad();
    document.fonts && document.fonts.ready.then(measureMono);
    // Opening shot: start way out over everyone's page and swoop down to your notebook, then ask for a difficulty.
    const ready = () => titleDone.then(() => {
      landTitle();
      setTimeout(() => { if (!state.picked) openIntro(); else { busy = false; setPad(); } }, reduced ? 0 : 560);
    });
    // Hold far out behind the start gate; the first click, tap or key starts the music and the intro together.
    const to = homeCam();
    if (!reduced) cam = { x: to.x + 3e4, y: to.y - 4e4, s: to.s / 5000 };
    busy = true; setPad();
    let started = false;
    const go = e => {
      if (started) return;
      started = true; e && e.preventDefault();
      removeEventListener("keydown", go);
      music();
      const gate = $("gate"); gate.classList.add("out"); setTimeout(() => gate.remove(), 600);
      document.body.classList.remove("gated");
      playTitle();
      if (reduced) ready();
      else flight = { f: makeFlight(cam, to), to, t0: performance.now() + 300, ms: 2800, done: ready };
    };
    $("gate").addEventListener("click", go);
    addEventListener("keydown", go);
    $("gate").focus({ preventScroll: true });
    requestAnimationFrame(frame);
  }
  window.claude?.hot?.snapshot?.(() => ({ ...state }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
